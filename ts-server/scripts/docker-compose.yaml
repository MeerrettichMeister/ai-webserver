services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The server itself, built from ../Dockerfile. Only started with `--profile app`, so that
  # `up -d` keeps starting just the database and Keycloak for `pnpm dev` (which also uses port 3000).
  ts-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ts-server
    profiles: [app]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Tokens must have been issued for this host: those from POST /auth are, those requested
      # from Keycloak at localhost:8080 are not (their issuer names localhost).
      KEYCLOAK_URL: keycloak
      KEYCLOAK_PORT: "8080"
      KEYCLOAK_REALM: ai-webserver
      KEYCLOAK_CLIENT_ID: ts-server
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ../tls:/app/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
