[project]
name = "py-server"
version = "0.1.0"
description = "Recipe API built with FastAPI and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
# target-version is inferred from requires-python.
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    "PTH",   # flake8-use-pathlib
    "T20",   # flake8-print
    "DTZ",   # flake8-datetimez
    "S",     # flake8-bandit
    "ASYNC", # flake8-async
    "FAST",  # FastAPI
    "PERF",  # perflint
    "FURB",  # refurb
    "RUF",   # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "FAST003", # misses path params consumed by Annotated dependency aliases (e.g. RecipeDep)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # allow assert in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = ["**/.venv/**", "**/__pycache__/**"]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "ruff>=0.17.1",
]
